name: Construir APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - trabajo/sincronizacion-nube
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android-source/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar código fuente
        run: |
          test -f android-source/settings.gradle
          test -f android-source/app/build.gradle
          test -f android-source/app/src/main/assets/www/app.js

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar archivos Java y dependencias
        working-directory: android-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app")
          for file in app.rglob("*.java"):
              data = file.read_bytes()
              data = data.removeprefix(bytes.fromhex("efbbbf"))
              data = data.lstrip(bytes([10, 13]))
              file.write_bytes(data)

          gradle_file = app / "build.gradle"
          content = gradle_file.read_text(encoding="utf-8")
          marker = "configurations.configureEach {"
          if marker not in content:
              gradle_file.write_text(content + """

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          """, encoding="utf-8")
          PY

      - name: Construir APK
        working-directory: android-source
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Diego-Cocina-en-Casa-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
