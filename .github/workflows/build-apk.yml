
name: Construir APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir android-project
          unzip -q Diego_cocina_en_casa_proyecto_Android-1.zip -d android-project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró settings.gradle"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Diego-Cocina-en-Casa-APK
          path: app-debug.apk
