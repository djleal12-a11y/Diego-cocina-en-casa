name: Construir APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir android-project
          unzip -q Diego_cocina_en_casa_proyecto_Android-1.zip -d android-project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Corregir archivos Java y dependencias
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -print -quit)")
          APP_DIR="$PROJECT_DIR/app"

          python3 - "$APP_DIR" <<'PY'
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])

          for file in app.rglob("*.java"):
              data = file.read_bytes()
              data = data.removeprefix(b"\xef\xbb\xbf")
              data = data.lstrip(b"\r\n")
              file.write_bytes(data)

          gradle_file = app / "build.gradle"

          with gradle_file.open("a", encoding="utf-8") as f:
              f.write("""
          
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          """)
          PY

      - name: Construir APK
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -print -quit)")
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Diego-Cocina-en-Casa-APK
          path: app-debug.apk
